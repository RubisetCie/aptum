name: Build Release
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (amd64, i386, etc)'
        default: 'amd64'
        required: true
      releases:
        description: Create release
        type: boolean
        required: true
        default: true
      artifacts:
        description: Upload artifacts
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: RubisetCie/build-deb-action@master
        env:
          DEB_BUILD_PROFILES: pkg.apt.nosqv
          BUILD_PRE: 'rm /usr/bin/sqv'
        with:
          buildpackage-opts: --build=binary --no-sign
          docker-image: debian:testing-slim
          host-arch: ${{github.event.inputs.arch}}
      - id: version
        if: ${{github.event.inputs.releases=='true'}}
        name: Extract Version
        run: |
          for f in debian/artifacts/apt_*.deb; do
            while IFS='_' read -ra s; do
              echo "TAG_VERSION=${s[1]}" >> $GITHUB_OUTPUT
            done <<< "$f";break
          done
      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{github.event.inputs.releases=='true'}}
        with:
          name: ${{steps.version.outputs.TAG_VERSION}}
          tag_name: ${{steps.version.outputs.TAG_VERSION}}
          prerelease: false
          draft: true
          files: debian/artifacts/*.deb
      - name: Upload
        uses: actions/upload-artifact@v6
        if: ${{github.event.inputs.artifacts=='true'}}
        with:
          name: aptum-${{github.event.inputs.arch}}
          path: 'debian/artifacts/*'
          compression-level: 9
          if-no-files-found: error
